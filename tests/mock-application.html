<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ApplyPilot mock application</title></head>
<body>
  <main>
    <h1>Backend Engineer — mock application</h1>
    <form>
      <label for="first">First name</label><input id="first" name="first_name" required>
      <label for="last">Last name</label><input id="last" name="last_name" required>
      <label for="email">Email address</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone number</label><input id="phone" name="phone" type="tel">
      <label for="title">Current job title</label><input id="title" name="current_title">
      <label for="country">Country</label><select id="country" name="country"><option value="">Choose one</option><option>India</option><option>United States</option></select>
      <fieldset><legend>Will you now or in the future require visa sponsorship?</legend><label><input type="radio" name="sponsor" value="Yes"> Yes</label><label><input type="radio" name="sponsor" value="No"> No</label></fieldset>
      <label for="custom">A required question ApplyPilot cannot know</label><input id="custom" name="custom_question" required>
      <button type="button">Next</button><button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
